<!doctype html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PubQuizStats</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/vendor/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div>
          <div class="brand-name">PubQuizStats</div>
          <div class="brand-sub" id="db-label"></div>
        </div>
      </div>
      <div class="sidebar-filters" id="global-filters"></div>
      <a class="coffee-link" href="https://www.buymeacoffee.com/pubquizstats" target="_blank" rel="noopener noreferrer"><img src="/img/bmc-button.png" alt="Buy Me a Coffee" width="217" height="61" /></a>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <nav class="legal-links" aria-label="Rechtliche Informationen">
          <a href="/impressum.html">Impressum</a>
          <a href="/datenschutz.html">Datenschutz</a>
          <a href="/kontakt.html">Kontakt</a>
        </nav>
        <div id="auth-box"></div>
        <button class="btn ghost" id="theme-toggle" title="Hell/Dunkel umschalten">Design</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menü">&#9776;</button>
        <div class="title-block">
          <h1 id="page-title">PubQuizStats</h1>
          <p id="page-desc" class="muted"></p>
        </div>
        <div class="topbar-actions" id="actions"></div>
      </header>

      <section class="filters" id="filters"></section>

      <main id="content" class="content"></main>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>
  <script src="/app.js"></script>
</body>
</html>
